<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14161B" />
    <title></title>
    <link rel="stylesheet" href="/v4/style/base.css" />
    <link rel="stylesheet" href="/v4/style/deck.css" />
    <link rel="stylesheet" href="/v4/style/settings.css" />
  </head>
  <body>
    <main id="settings-missing" class="settings-missing" hidden>
      <div class="disconnected-mark">T</div>
      <p data-i18n="settings.missingKey"></p>
    </main>
    <main id="settings-app" class="settings-app" hidden>
      <header class="settings-header">
        <h1 data-i18n="settings.title"></h1>
        <p id="settings-connection" class="settings-connection"></p>
      </header>
      <div id="settings-offline" class="offline-band" data-i18n="connection.offline" hidden></div>
      <section id="settings-conflict" class="settings-conflict" hidden>
        <span data-i18n="settings.externalChange"></span>
        <button type="button" data-conflict="reload" data-i18n="settings.reload"></button>
        <button type="button" data-conflict="keep" data-i18n="settings.keepEditing"></button>
      </section>
      <div class="settings-body">
        <nav id="settings-nav" class="settings-nav" data-i18n-label="settings.navigation">
          <button type="button" class="is-active" data-section="layout">
            <span aria-hidden="true">▦</span><b data-i18n="settings.nav.layout"></b>
          </button>
          <button type="button" data-section="presets"><span aria-hidden="true">◇</span><b data-i18n="settings.nav.presets"></b></button>
          <button type="button" data-section="appearance"><span aria-hidden="true">✦</span><b data-i18n="settings.nav.appearance"></b></button>
          <button type="button" data-section="saved"><span aria-hidden="true">▣</span><b data-i18n="settings.nav.saved"></b></button>
          <button type="button" data-section="connection"><span aria-hidden="true">⌁</span><b data-i18n="settings.nav.connection"></b></button>
          <button type="button" data-section="pc"><span aria-hidden="true">▤</span><b data-i18n="settings.nav.pc"></b></button>
          <button type="button" data-section="general"><span aria-hidden="true">⚙</span><b data-i18n="settings.nav.general"></b></button>
        </nav>
        <section class="settings-workspace">
          <aside id="settings-catalog" class="settings-panel settings-catalog">
            <div id="settings-section-layout"></div>
            <div id="settings-section-presets" hidden></div>
            <div id="settings-section-appearance" hidden></div>
            <div id="settings-section-saved" hidden></div>
            <div id="settings-section-connection" hidden></div>
            <div id="settings-section-pc" hidden></div>
            <div id="settings-section-general" hidden></div>
          </aside>
          <section class="settings-preview-column">
            <div class="settings-preview-toolbar">
              <h2 id="settings-preview-title" data-i18n="settings.preview.title"></h2>
              <div class="settings-toolbar-actions">
                <button id="settings-preset-back" type="button" data-i18n="presets.previewBack" hidden></button>
                <label class="preview-view-field"><span data-i18n="settings.preview.view"></span>
                  <select id="settings-preview-mode">
                    <option value="pc" data-i18n="settings.preview.pc"></option>
                    <option value="phone" data-i18n="settings.preview.phone"></option>
                  </select>
                </label>
                <select id="settings-preview-ratio" data-i18n-label="settings.preview.ratio" hidden>
                  <option value="auto" data-i18n="settings.preview.auto"></option>
                  <option value="16:9">16:9</option><option value="18:9">18:9</option><option value="19.5:9">19.5:9</option>
                  <option value="20:9">20:9</option><option value="4:3" data-i18n="settings.preview.tablet"></option>
                </select>
                <div class="orientation-switch">
                  <button type="button" data-orientation="landscape" class="is-active" data-i18n="settings.orientation.landscape"></button
                  ><button type="button" data-orientation="portrait" data-i18n="settings.orientation.portrait"></button>
                </div>
                <button id="settings-undo" type="button" data-i18n="settings.undo" disabled></button>
              </div>
            </div>
            <div id="settings-layout-tools" class="settings-layout-tools">
              <div id="settings-pages" class="settings-pages"></div>
              <div id="settings-grid-size" class="settings-grid-size"></div>
            </div>
            <div id="settings-preview" class="settings-preview-placeholder" data-i18n="settings.preview.loading"></div>
          </section>
          <aside id="settings-inspector" class="settings-panel settings-inspector">
            <h2 data-i18n="settings.inspector.title"></h2>
            <p data-i18n="settings.inspector.empty"></p>
          </aside>
        </section>
      </div>
      <p id="settings-notice" class="settings-notice" role="status" hidden></p>
      <footer id="settings-save-status" class="settings-save-status" data-i18n="settings.saved"></footer>
    </main>
    <script src="/qrcode.js"></script>
    <script type="module" src="/v4/settings/app.js"></script>
  </body>
</html>
